[project]
name = "mcp-template-python"
version = "0.1.0"
description = "A simple template implementation of the Model Context Protocol (MCP) server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=0.6.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/edward-x-yang/mcp-template-python"
Repository = "https://github.com/edward-x-yang/mcp-template-python"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
